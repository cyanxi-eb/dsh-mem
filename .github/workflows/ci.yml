name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite 在 22 需要 --experimental-sqlite；24+ 直接可用，CI 只跑 24/26。
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax
        run: |
          node --check index.mjs
          node --check lib/core.mjs
          node --check lib/portable.mjs
          node --check bin/dsh-mem.mjs
      - name: selftest
        run: node bin/dsh-mem.mjs selftest
      - name: unit + round-trip + plugin load
        run: node --test
